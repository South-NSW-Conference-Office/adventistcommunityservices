name: Build and Deploy Docker (Staging)

on:
  push:
    branches: [staging]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: south-nsw-conference-office/adventistcommunityservices
  STAGING_API_URL: https://staging-api.communityservices.org.au

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=staging
            type=sha,prefix=staging-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ env.STAGING_API_URL }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Migrated 2026-08-17 from Genesis (kylevps) to snswserver, over SSH
  # (mirrors morpheustools' deploy-frontend job — no self-hosted runner on
  # snswserver).
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    concurrency:
      group: deploy-acs-website-staging-snswserver
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 107.155.65.229
          username: snswcomms
          key: ${{ secrets.SNSW_SSH_KEY }}
          source: deploy/docker-compose.snswserver.yml
          target: /opt/acs-website-staging/

      - name: Pull and restart on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 107.155.65.229
          username: snswcomms
          key: ${{ secrets.SNSW_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            cd /opt/acs-website-staging
            mv deploy/docker-compose.snswserver.yml docker-compose.yml
            rmdir deploy 2>/dev/null || true
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
